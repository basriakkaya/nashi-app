name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [owner-pr-merged]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated language tables
        run: python3 scripts/generate-localizations.py --check
      - name: Owner merge authorization regressions
        run: python3 scripts/test-owner-auto-merge.py
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Scan full public history for secrets
        run: python3 scripts/scan-secrets.py
  mac-source:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Prepare pinned local conversion tools
        run: python3 scripts/setup-kage-tools.py
      - name: Build and verify the packaged Kage app
        run: zsh scripts/build-kage.sh release
      - name: Full core and update regression suite
        run: swift test
      - name: Native UI, accessibility and artwork checks
        run: python3 scripts/test-native-ui.py --app build/Kage.app/Contents/MacOS/Kage
      - name: Packaged conversion and export checks
        run: build/Kage.app/Contents/MacOS/Kage --kage-smoke work/packaged-smoke
      - name: Audio formats, signals, channels, loudness and batch exports
        run: python3 scripts/test-kage-audio.py --app build/Kage.app --output work/audio-qa
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-native-validation
          path: |
            build/native-ui
            work/packaged-smoke/kage-smoke.json
            work/audio-qa/audio-qa.json
          retention-days: 7
          if-no-files-found: warn
